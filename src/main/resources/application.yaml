server:
  port: 8085

spring:
  application:
    name: api-consulta
  cloud:
    compatibility-verifier:
      enabled: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

clients:
  gestao-conta:
    url: http://localhost:8081

feign:
  client:
    config:
      gestao-conta:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      gestao-conta:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15s
  retry:
    instances:
      gestao-conta:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - feign.RetryableException
        ignoreExceptions:
          - br.com.banco.api_consulta.core.exception.ContaNaoEncontradaException
  timelimiter:
    instances:
      gestao-conta:
        timeoutDuration: 5s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers, retries, metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true